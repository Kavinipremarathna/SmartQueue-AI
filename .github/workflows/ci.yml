name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --configuration Release

      - name: Test backend
        run: dotnet test tests/SmartQueueAPI.Tests/SmartQueueAPI.Tests.csproj --configuration Release --no-build

      - name: Backend auth and queue smoke test
        run: |
          dotnet run --urls http://localhost:5055 > backend.log 2>&1 &
          TOKEN=""
          for i in {1..20}; do
            LOGIN_RESPONSE=$(curl -sS -X POST http://localhost:5055/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"admin123"}' || true)

            if [ -n "$LOGIN_RESPONSE" ]; then
              TOKEN=$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('token',''))" "$LOGIN_RESPONSE" 2>/dev/null || true)
            fi

            if [ -n "$TOKEN" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TOKEN" ]; then
            echo "Login token was not acquired"
            cat backend.log
            exit 1
          fi

          curl -fsS http://localhost:5055/api/queue/current \
            -H "Authorization: Bearer $TOKEN"

          pkill -f "dotnet run" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
