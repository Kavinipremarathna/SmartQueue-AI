services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: smartqueue
      POSTGRES_DB: smartqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5055:5055"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartqueue;Username=smartqueue;Password=smartqueue
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
